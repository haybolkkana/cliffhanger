<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Command Game</title>
    <style>
        body {
            margin: 0; padding: 0; background: #111; color: #fff;
            font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            height: 100vh; overflow: hidden; user-select: none;
        }
        #game-container {
            position: relative; display: flex; flex-grow: 1;
            align-items: center; justify-content: center; width: 100%;
        }
        #map {
            position: relative; display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(7, 1fr);
            gap: 2px; width: 90vw; max-width: 350px; aspect-ratio: 5 / 7;
            background: #222; padding: 4px; border: 4px solid #444;
        }
        .tile { width: 100%; height: 100%; position: relative; z-index: 1; }
        .stone { background: #777; border: 1px solid #555; }
        .lava { background: #d32f2f; border: 1px solid #b71c1c; animation: pulse 1.5s infinite alternate; }
        @keyframes pulse { to { background: #ff5722; } }
        .start-tile::after { content: "S"; position: absolute; color: #0ff; bottom: 2px; right: 4px; font-weight: bold; }
        .goal-tile::after { content: "G"; position: absolute; color: #fd0; top: 2px; left: 4px; font-weight: bold; }
        
        #player {
            position: absolute; width: 32px; height: 32px;
            background-image: url('pipo-nekonin001.png'); background-repeat: no-repeat;
            transition: left 0.2s, top 0.2s; transform: translate(-50%, -50%);
            z-index: 10; display: none;
        }
        
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20;
        }
        .hidden { display: none !important; }
        button {
            background: #444; color: #fff; border: 2px solid #fff;
            padding: 10px 20px; font-size: 18px; font-family: inherit; cursor: pointer;
        }
        button:active { transform: translateY(2px); }
        
        #mic-area {
            width: 100%; height: 25vh; background: #222; border-top: 4px solid #333;
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
        }
        .listening { background: #b71c1c !important; animation: mic-pulse 2s infinite; }
        @keyframes mic-pulse { 50% { opacity: 0.8; } }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="map"></div>
        
        <div id="screen-start" class="overlay">
            <h1 style="margin-bottom: 20px;">LAVA MAZE</h1>
            <button onclick="startGame()">Game Start</button>
        </div>
        <div id="screen-over" class="overlay hidden">
            <h1 style="color: #f33; margin-bottom: 20px;">Game Over</h1>
            <button onclick="resetGame()">Retry</button>
        </div>
        <div id="screen-clear" class="overlay hidden">
            <h1 style="color: #fd0; margin-bottom: 20px;">Game Clear!</h1>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <div id="mic-area">
        <div id="mic-status" style="font-size: 20px; font-weight: bold;">TOUCH TO SPEAK</div>
        <div style="font-size: 12px; color: #aaa; margin-top: 8px;">위 / 아래 / 오른쪽 / 왼쪽</div>
    </div>

    <script>
        // # 2026/05/30 14:29 Geminiで機能追加 スタート画面・クリア画面の実装およびZインデックス競合の修正

        const mapStr = `
__0__
__00_
0000_
0____
000__
__0__
__0__`.trim().split('\n');

        const COLS = 5, ROWS = 7;
        const START = { x: 2, y: 6 }, GOAL = { x: 2, y: 0 };
        let px = START.x, py = START.y, pDir = 3;
        let animIdx = 0, animSeq = [0, 1, 2, 1];
        let state = 'start'; 
        let recognition = null, isListening = false;

        const mapEl = document.getElementById('map');
        let playerEl = document.createElement('div');
        playerEl.id = 'player';

        function initMap() {
            mapEl.innerHTML = '';
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    let div = document.createElement('div');
                    div.className = 'tile ' + (mapStr[y][x] === '0' ? 'stone' : 'lava');
                    if (x === START.x && y === START.y) div.classList.add('start-tile');
                    if (x === GOAL.x && y === GOAL.y) div.classList.add('goal-tile');
                    mapEl.appendChild(div);
                }
            }
            // タイル生成後にプレイヤー要素を追加し、確実に最前面へ配置する
            mapEl.appendChild(playerEl);
            updatePos();
        }

        function updatePos() {
            playerEl.style.left = ((px + 0.5) * (100 / COLS)) + '%';
            playerEl.style.top = ((py + 0.5) * (100 / ROWS)) + '%';
            updateSprite();
        }

        function updateSprite() {
            let bgX = -(animSeq[animIdx] * 32);
            let bgY = -(pDir * 32);
            playerEl.style.backgroundPosition = `${bgX}px ${bgY}px`;
        }

        setInterval(() => {
            if (state !== 'play') return;
            animIdx = (animIdx + 1) % animSeq.length;
            updateSprite();
        }, 200);

        function startGame() {
            document.getElementById('screen-start').classList.add('hidden');
            playerEl.style.display = 'block';
            state = 'play';
            initSpeech();
        }

        function resetGame() {
            document.getElementById('screen-over').classList.add('hidden');
            document.getElementById('screen-clear').classList.add('hidden');
            px = START.x; py = START.y; pDir = 3;
            state = 'play';
            updatePos();
        }

        function processCmd(cmd) {
            if (state !== 'play') return;
            let nx = px, ny = py;

            if (cmd.includes('위')) { pDir = 3; ny--; }
            else if (cmd.includes('아래')) { pDir = 0; ny++; }
            else if (cmd.includes('오른쪽')) { pDir = 2; nx++; }
            else if (cmd.includes('왼쪽')) { pDir = 1; nx--; }
            else return;

            updateSprite();
            
            if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                px = nx; py = ny;
            } else {
                gameOver();
                return;
            }

            updatePos();

            if (px === GOAL.x && py === GOAL.y) gameClear();
            else if (mapStr[py][px] !== '0') gameOver();
        }

        function gameOver() {
            state = 'end';
            document.getElementById('screen-over').classList.remove('hidden');
        }

        function gameClear() {
            state = 'end';
            document.getElementById('screen-clear').classList.remove('hidden');
        }

        function initSpeech() {
            if (recognition) return;
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return alert("ブラウザが音声認識をサポートしていない。");
            
            recognition = new SR();
            recognition.lang = 'ko-KR';
            recognition.continuous = true;

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('mic-area').classList.add('listening');
                document.getElementById('mic-status').innerText = "LISTENING...";
            };
            
            recognition.onresult = e => {
                processCmd(e.results[e.results.length - 1][0].transcript);
            };
            
            recognition.onend = () => {
                if (isListening && state === 'play') {
                    recognition.start();
                } else {
                    document.getElementById('mic-area').classList.remove('listening');
                    document.getElementById('mic-status').innerText = "TOUCH TO SPEAK";
                }
            };
        }

        document.getElementById('mic-area').addEventListener('click', () => {
            if (!recognition) return;
            if (!isListening) { 
                isListening = true; 
                recognition.start(); 
            } else { 
                isListening = false; 
                recognition.stop(); 
            }
        });

        window.onload = initMap;
    </script>
</body>
</html>
