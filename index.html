<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Command Game</title>
    <style>
        body {
            margin: 0; padding: 0; background: #111; color: #fff;
            font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            height: 100vh; overflow: hidden; user-select: none;
        }
        #game-container {
            position: relative; display: flex; flex-grow: 1;
            align-items: center; justify-content: center; width: 100%;
        }
        #map {
            position: relative; display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(7, 1fr);
            gap: 2px; width: 90vw; max-width: 350px; aspect-ratio: 5 / 7;
            background: #222; padding: 4px; border: 4px solid #444;
        }
        .tile { width: 100%; height: 100%; position: relative; z-index: 1; }
        .ground { background: linear-gradient(to top, #777 0%, #777 5%, transparent 5%, transparent 100%); }
        .empty { background: transparent; }
        .ladder { background: repeating-linear-gradient(0deg, transparent, transparent 10px, #aaa 10px, #aaa 12px), linear-gradient(90deg, transparent 20%, #aaa 20%, #aaa 25%, transparent 25%, transparent 75%, #aaa 75%, #aaa 80%, transparent 80%), linear-gradient(to top, #777 0%, #777 5%, transparent 5%, transparent 100%); }
        .start-tile::after { content: "S"; position: absolute; color: #0ff; top: 2px; right: 4px; font-weight: bold; }
        .goal-tile::after { content: "G"; position: absolute; color: #fd0; top: 2px; left: 4px; font-weight: bold; }
        
        #player {
            position: absolute; width: 32px; height: 32px;
            background-image: url('pipo-nekonin001.png'); background-repeat: no-repeat;
            transition: left 0.2s, top 0.2s; 
            transform: translate(-50%, -50%) scale(2); /* 2倍に拡大 */
            image-rendering: pixelated; /* ドットのぼやけ防止 */
            z-index: 10; display: none;
        }
        
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20;
        }
        .hidden { display: none !important; }
        button {
            background: #444; color: #fff; border: 2px solid #fff;
            padding: 10px 20px; font-size: 18px; font-family: inherit; cursor: pointer;
        }
        button:active { transform: translateY(2px); }
        
        #mic-area {
            width: 100%; height: 25vh; background: #222; border-top: 4px solid #333;
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
        }
        .listening { background: #b71c1c !important; animation: mic-pulse 2s infinite; }
        @keyframes mic-pulse { 50% { opacity: 0.8; } }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="map"></div>
        
        <div id="screen-start" class="overlay">
            <h1 style="margin-bottom: 20px;">LAVA MAZE</h1>
            <button onclick="startGame()">Game Start</button>
        </div>
        <div id="screen-over" class="overlay hidden">
            <h1 style="color: #f33; margin-bottom: 20px;">Game Over</h1>
            <button onclick="resetGame()">Retry</button>
        </div>
        <div id="screen-clear" class="overlay hidden">
            <h1 style="color: #fd0; margin-bottom: 20px;">Game Clear!</h1>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <div id="mic-area">
        <div id="mic-status" style="font-size: 20px; font-weight: bold;">TOUCH TO SPEAK</div>
        <div style="font-size: 12px; color: #aaa; margin-top: 8px;">위 / 아래(밑) / 오른쪽 / 왼쪽</div>
        <div id="debug-text" class="hidden" style="color: #0ff; font-size: 14px; margin-top: 10px;"></div>
    </div>

    <script>
        // # 2026/05/30 16:41 Geminiで機能追加 認識結果の重複カウント表示と<None>判定、iOSデバッグ用ライフサイクル可視化
        // # 2026/05/30 16:02 Geminiで機能追加 音声認識インスタンスの再構築とエラー可視化、Wake Lockの監視強化
        // # 2026/05/30 15:55 Geminiで機能追加 Screen Wake Lock APIとPage Visibility APIによるスリープ対策・復帰処理の追加
        // # 2026/05/30 15:28 Geminiで機能追加 音声コマンド「밑」の判定追加
        // # 2026/05/30 15:17 Geminiで機能追加 サイドビューパズルアクション化、重力・梯子の導入、音声認識自動起動
        // # 2026/05/30 14:40 Geminiで機能追加 キャラクターの拡大、判定タイミングの遅延、4段階消滅エフェクト、デバッグモード

        const mapStr = `
G____
0000#
___0#
#0#_#
#_000
0#__0
__#_S`.trim().split('\n');

        const COLS = 5, ROWS = 7;
        const START = { x: 4, y: 6 }, GOAL = { x: 0, y: 0 };
        let px = START.x, py = START.y, pDir = 3;
        let animIdx = 0, animSeq = [0, 1, 2, 1];
        let state = 'start'; 
        let recognition = null, isListening = false;
        let wakeLock = null;
        
        let DEBUG_MODE = true; // デバッグモードの切り替えフラグ
        let lastResult = "";
        let resultCount = 0;

        const mapEl = document.getElementById('map');
        let playerEl = document.createElement('div');
        playerEl.id = 'player';

        function displayResult(text) {
            if (!DEBUG_MODE) return;
            let dbg = document.getElementById('debug-text');
            if (text === lastResult) {
                resultCount++;
                dbg.innerText = text + "(" + resultCount + ")";
            } else {
                lastResult = text;
                resultCount = 1;
                dbg.innerText = text;
            }
            dbg.classList.remove('hidden');
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    if (DEBUG_MODE) {
                        displayResult("WAKE LOCK: ACQUIRED");
                    }
                }
            } catch (err) {
                if (DEBUG_MODE) {
                    displayResult("WAKE LOCK ERROR: " + err.name);
                }
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                if (state === 'play' || state === 'moving' || state === 'falling') {
                    requestWakeLock();
                    initSpeech(); // フリーズ回避のためにインスタンスを完全に再構築
                    if (recognition && !isListening) {
                        isListening = true;
                        try { recognition.start(); } catch(e) {}
                    }
                }
            } else {
                releaseWakeLock();
                if (recognition && isListening) {
                    isListening = false;
                    try { recognition.stop(); } catch(e) {}
                }
            }
        });

        function initMap() {
            mapEl.innerHTML = '';
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    let div = document.createElement('div');
                    let char = mapStr[y][x];
                    let typeClass = (char === '_' || char === 'S' || char === 'G') ? 'ground' : (char === '#' ? 'ladder' : 'empty');
                    div.className = 'tile ' + typeClass;
                    if (x === START.x && y === START.y) div.classList.add('start-tile');
                    if (x === GOAL.x && y === GOAL.y) div.classList.add('goal-tile');
                    mapEl.appendChild(div);
                }
            }
            mapEl.appendChild(playerEl);
            updatePos();
        }

        function updatePos() {
            playerEl.style.left = ((px + 0.5) * (100 / COLS)) + '%';
            playerEl.style.top = ((py + 0.5) * (100 / ROWS)) + '%';
            updateSprite();
        }

        function updateSprite() {
            let bgX = -(animSeq[animIdx] * 32);
            let bgY = -(pDir * 32);
            playerEl.style.backgroundPosition = `${bgX}px ${bgY}px`;
        }

        setInterval(() => {
            if (state !== 'play' && state !== 'moving') return;
            animIdx = (animIdx + 1) % animSeq.length;
            updateSprite();
        }, 200);

        function startGame() {
            document.getElementById('screen-start').classList.add('hidden');
            playerEl.style.display = 'block';
            playerEl.style.opacity = 1;
            state = 'play';
            initSpeech();
            requestWakeLock();
            if (recognition && !isListening) {
                isListening = true;
                recognition.start();
            }
        }

        function resetGame() {
            document.getElementById('screen-over').classList.add('hidden');
            document.getElementById('screen-clear').classList.add('hidden');
            if (DEBUG_MODE) {
                document.getElementById('debug-text').innerText = "";
                lastResult = "";
                resultCount = 0;
            }
            px = START.x; py = START.y; pDir = 3;
            playerEl.style.opacity = 1;
            state = 'play';
            updatePos();
            requestWakeLock();
            if (recognition && !isListening) {
                isListening = true;
                recognition.start();
            }
        }

        function processCmd(cmd) {
            if (state !== 'play') return;
            let nx = px, ny = py;

            let onLadder = (mapStr[py][px] === '#');
            let ladderBelow = (py + 1 < ROWS && mapStr[py + 1][px] === '#');

            if (cmd.includes('위')) { 
                if (!onLadder) return;
                pDir = 3; ny--; 
            }
            else if (cmd.includes('아래') || cmd.includes('밑')) { 
                if (!ladderBelow) return;
                pDir = 0; ny++; 
            }
            else if (cmd.includes('오른쪽')) { pDir = 2; nx++; }
            else if (cmd.includes('왼쪽')) { pDir = 1; nx--; }
            else return;

            updateSprite();
            
            if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                px = nx; py = ny;
            } else {
                return;
            }

            updatePos();
            state = 'moving'; // 移動アニメーション中の重複判定を防ぐ

            // 移動アニメーション完了後(0.2秒後)に判定を行う
            setTimeout(() => {
                checkGravity(0);
            }, 200);
        }

        function checkGravity(fallDist) {
            if (mapStr[py][px] === '0') {
                state = 'falling';
                setTimeout(() => {
                    if (py + 1 < ROWS) {
                        py++;
                        updatePos();
                        checkGravity(fallDist + 1);
                    } else {
                        execGameOverEffect();
                    }
                }, 200);
            } else {
                if (fallDist >= 2) {
                    execGameOverEffect();
                } else if (mapStr[py][px] === 'G') {
                    gameClear();
                } else {
                    state = 'play';
                }
            }
        }

        function execGameOverEffect() {
            state = 'end';
            let step = 0;
            // 4段階の消滅エフェクト
            let effectTimer = setInterval(() => {
                step++;
                playerEl.style.opacity = 1 - (step * 0.25);
                if (step >= 4) {
                    clearInterval(effectTimer);
                    gameOver();
                }
            }, 100);
        }

        function gameOver() {
            document.getElementById('screen-over').classList.remove('hidden');
            releaseWakeLock();
        }

        function gameClear() {
            state = 'end';
            document.getElementById('screen-clear').classList.remove('hidden');
            releaseWakeLock();
        }

        function initSpeech() {
            // 既存のインスタンスが存在する場合はリスナーを解除して安全に破棄
            if (recognition) {
                recognition.onend = null;
                recognition.onerror = null;
                recognition.onstart = null;
                recognition.onresult = null;
                try { recognition.stop(); } catch(e) {}
            }

            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return alert("ブラウザが音声認識をサポートしていない。");
            
            recognition = new SR();
            recognition.lang = 'ko-KR';
            recognition.continuous = true;

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('mic-area').classList.add('listening');
                document.getElementById('mic-status').innerText = "LISTENING... (START)";
            };

            recognition.onaudiostart = () => {
                if (DEBUG_MODE) document.getElementById('mic-status').innerText = "LISTENING... (AUDIO ON)";
            };

            recognition.onspeechstart = () => {
                if (DEBUG_MODE) document.getElementById('mic-status').innerText = "LISTENING... (SPEECH ON)";
            };

            recognition.onspeechend = () => {
                if (DEBUG_MODE) document.getElementById('mic-status').innerText = "LISTENING... (SPEECH END)";
            };
            
            recognition.onresult = e => {
                let transcript = e.results[e.results.length - 1][0].transcript.trim();
                displayResult(transcript);
                processCmd(transcript);
            };

            recognition.onnomatch = () => {
                displayResult("<None>");
            };

            recognition.onerror = e => {
                if (e.error === 'no-speech') {
                    displayResult("<None>");
                } else if (DEBUG_MODE) {
                    displayResult("MIC ERROR: " + e.error);
                    lastResult = ""; // エラー時にカウントをリセット
                }
                isListening = false;
            };
            
            recognition.onend = () => {
                if (DEBUG_MODE) document.getElementById('mic-status').innerText = "MIC ENDED";
                if (isListening && (state === 'play' || state === 'moving' || state === 'falling')) {
                    try { recognition.start(); } catch(e) {}
                } else {
                    document.getElementById('mic-area').classList.remove('listening');
                    document.getElementById('mic-status').innerText = "TOUCH TO SPEAK";
                }
            };
        }

        document.getElementById('mic-area').addEventListener('click', () => {
            if (!recognition) return;
            if (!isListening) { 
                isListening = true; 
                try { recognition.start(); } catch(e) {}
            } else { 
                isListening = false; 
                try { recognition.stop(); } catch(e) {}
            }
        });

        window.onload = initMap;
    </script>
</body>
</html>
